<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Taproot the Game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
  /* Layout: flat plum background. Landing = title + button left, character art right (fades into the bg). Creator = preview stage left, controls right. */
  :root {
    --bg: #150f24;
    --panel: rgba(24, 18, 42, 0.88);
    --fg: #f0e9dc;
    --dim: #a89fb8;
    --accent: #d4a94f;
    --line: rgba(212, 169, 79, 0.26);
    --accent-soft: rgba(212, 169, 79, 0.14);
    --ink: #2a1f45;
    --sky: #cdc6dc;
    --display: 'Cinzel', Georgia, serif;
    --body: 'Alegreya Sans', system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .bg {
    position: fixed; inset: 0; z-index: 0;
    background: var(--sky) url("/game/bg.webp") 72% 0% / cover no-repeat;
  }
  .bg.dim { filter: brightness(0.35) blur(4px); }

  .screen { position: relative; z-index: 1; min-height: 100%; }

  /* Landing */
  #landing { padding-block: 22px; box-sizing: border-box; }
  .mark {
    background: none; border: 0; padding: 0; color: #fff;
    font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase;
    text-shadow: 0 1px 14px rgba(42, 31, 69, 0.65); transition: opacity 0.2s;
  }
  .mark:hover { opacity: 0.8; }
  .btn {
    font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase;
    background: var(--accent); color: #17120a; border: 0; border-radius: 4px; padding: 14px 44px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(212, 169, 79, 0.35); }
  .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 10px 18px; font-size: 12px; }
  .btn.ghost:hover { border-color: var(--accent); box-shadow: none; }

  /* Creator */
  .wrap { max-width: 940px; margin: 0 auto; padding-block: 28px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .top h2 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.05em; margin: 0; }
  .grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }

  .stage {
    height: 228px; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px; box-sizing: border-box;
    background: linear-gradient(#2a2148 0%, #5a4272 62%, #8a6a78 62.5%, #2e2538 62.6%, #1c1626 100%);
  }
  .stage .big { width: 160px; }
  .caption { text-align: center; margin: 10px 0 0; font-family: var(--display); font-size: 16px; }
  .caption small { display: block; font-family: var(--body); font-size: 13px; color: var(--dim); margin-top: 2px; }
  .sizes { display: flex; align-items: flex-end; justify-content: center; gap: 22px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .sizes .s1 { width: 40px; } .sizes .s2 { width: 80px; }
  .sizes span { display: block; text-align: center; font-size: 12px; color: var(--dim); margin-top: 4px; }
  /* Sprites are 40x48 pixel art: only ever shown at 40 / 80 / 120 / 160px wide so pixels stay square. */
  .sprite { width: 100%; height: auto; display: block; image-rendering: pixelated; }

  .grp { margin-bottom: 20px; }
  .grp > .lbl { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .name {
    width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 6px;
    color: var(--fg); font-family: var(--display); font-size: 18px; padding: 10px 12px;
  }
  .opt { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; font-size: 15px; transition: border-color 0.15s, background 0.15s; }
  .opt:hover { border-color: var(--accent); }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .classes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .cls { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px; font-size: 14px; }
  .cls .mini { display: block; width: 40px; }
  .sw { width: 28px; height: 28px; border-radius: 50%; background: var(--c); border: 2px solid rgba(255,255,255,0.15); padding: 0; }

  /* Creator is compact: everything fits one laptop screen without scrolling. */
  #creator .wrap { max-width: 820px; padding-block: 20px; }
  #creator .top { margin-bottom: 14px; }
  #creator .top h2 { font-size: 19px; }
  #creator .grid { grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 16px; }
  #creator .panel { padding: 16px; }
  #creator .grp { margin-bottom: 14px; }
  #creator .grp > .lbl { margin-bottom: 6px; }
  #creator .name { font-size: 16px; padding: 8px 10px; }
  #creator .opt:not(.cls) { padding: 6px 12px; font-size: 14px; }
  .sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--bg); }
  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 6px; }
  #saveMsg { color: var(--dim); font-size: 14px; margin-right: auto; }
  .who { display: flex; align-items: center; gap: 10px; color: var(--dim); }

  [hidden] { display: none !important; }
  .modal { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 6, 20, 0.55); }
  .auth-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
  .auth-card h2 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.05em; margin: 0 0 6px; }
  .auth-card label { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .err { color: #ff9aa8; min-height: 1.4em; margin: 0; font-size: 14px; }
  .linkbtn { background: none; border: 0; color: var(--dim); text-decoration: underline; padding: 4px; font-size: 14px; }
  .linkbtn:hover { color: var(--fg); }

  .home-grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: start; }
  .side, .main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .card { text-align: center; }
  .portrait {
    height: 200px; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px; box-sizing: border-box;
    background: linear-gradient(#2a2148 0%, #5a4272 62%, #8a6a78 62.5%, #2e2538 62.6%, #1c1626 100%);
  }
  .portrait > div { width: 120px; }
  .card h3 { font-family: var(--display); font-size: 20px; margin: 14px 0 0; }
  .sub { color: var(--dim); font-size: 14px; margin: 2px 0 0; }
  .lvl { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); margin-top: 14px; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .h { font-family: var(--display); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
  .maphead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .maphead .h { margin: 0; }
  .map { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); aspect-ratio: 2 / 1; max-width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .map i { display: block; position: relative; }
  .map .you { position: absolute; inset: 28%; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07); font-size: 15px; }
  .list li:last-child { border-bottom: 0; }
  .list .meta { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
  .list em { color: #8fd694; font-style: normal; font-size: 13px; }
  .list em.down { color: #ff9aa8; }
  #armSaved { color: var(--dim); font-size: 14px; }
  .pwr {
    font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em;
    background: linear-gradient(135deg, rgba(212, 169, 79, 0.18), rgba(232, 196, 106, 0.18));
    border: 1px solid rgba(212, 169, 79, 0.45); border-radius: 4px; padding: 4px 12px;
    color: var(--accent);
  }
  .slot-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .slot-tab {
    flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 4px; text-align: center; font-family: var(--display); font-size: 10px;
    font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim);
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .tab-ico { display: block; font-size: 16px; line-height: 1; margin-bottom: 2px; }
  .slot-tab:hover { border-color: var(--accent); color: var(--fg); }
  .slot-tab[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .slot-tab .eq-dot { display: block; width: 6px; height: 6px; border-radius: 50%; margin: 4px auto 0; background: transparent; }
  .slot-tab[data-filled] .eq-dot { background: var(--accent); }
  .traits { display: flex; flex-direction: column; gap: 10px; }
  .trait { display: flex; align-items: center; gap: 8px; }
  .trait-lbl { width: 32px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--dim); }
  .trait-bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .trait-bar i { display: block; height: 100%; border-radius: 4px; transition: width 0.3s; }
  .trait-val { min-width: 56px; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; }
  .trait-val em { font-style: normal; font-size: 12px; color: #8fd694; }
  .trait-val em.down { color: #ff9aa8; }
  .trait[data-stat="hp"] .trait-bar i { background: #8fd694; }
  .trait[data-stat="atk"] .trait-bar i { background: #f07b7b; }
  .trait[data-stat="def"] .trait-bar i { background: #7ba8f0; }
  .trait[data-stat="mag"] .trait-bar i { background: #c07bf0; }
  .trait[data-stat="spd"] .trait-bar i { background: #7bf0d4; }
  .icards { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .icard {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 8px 8px; text-align: center;
    background: rgba(255,255,255,0.04); border: 2px solid var(--line); border-radius: 8px;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  .icard:hover { transform: translateY(-2px); }
  .icard .icard-icon { font-size: 32px; line-height: 1; }
  .icard-name { font-family: var(--display); font-size: 13px; line-height: 1.2; }
  .icard-rarity {
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 3px;
  }
  .icard-pwr { font-size: 12px; color: var(--dim); }
  .icard.common { border-color: rgba(154, 149, 168, 0.3); }
  .icard.common:hover { border-color: rgba(154, 149, 168, 0.6); }
  .icard.common .icard-rarity { background: rgba(154, 149, 168, 0.2); color: #9a95a8; }
  .icard.uncommon { border-color: rgba(143, 214, 148, 0.3); }
  .icard.uncommon:hover { border-color: rgba(143, 214, 148, 0.6); }
  .icard.uncommon .icard-name { color: #8fd694; }
  .icard.uncommon .icard-rarity { background: rgba(143, 214, 148, 0.2); color: #8fd694; }
  .icard.rare { border-color: rgba(123, 168, 240, 0.4); }
  .icard.rare:hover { border-color: rgba(123, 168, 240, 0.7); }
  .icard.rare .icard-name { color: #7ba8f0; }
  .icard.rare .icard-rarity { background: rgba(123, 168, 240, 0.2); color: #7ba8f0; }
  .icard.legendary { border-color: rgba(232, 196, 106, 0.5); }
  .icard.legendary:hover { border-color: rgba(232, 196, 106, 0.8); }
  .icard.legendary .icard-name { color: #e8c46a; }
  .icard.legendary .icard-rarity { background: rgba(232, 196, 106, 0.25); color: #e8c46a; }
  .icard[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 0 12px rgba(212, 169, 79, 0.2); }
  .icard.unequip { border-style: dashed; }
  .icard.unequip:hover { border-color: var(--dim); transform: translateY(-2px); }
  .arm-footer { display: flex; align-items: center; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }

  @media (max-width: 780px) {
    .grid, .home-grid { grid-template-columns: minmax(0, 1fr); }
    .stage { height: 180px; }
    .stage .big { width: 120px; }
  }
</style>
</head>
<body>

<div class="bg" id="bg" aria-hidden="true"></div>

<main class="screen" id="landing">
  <button class="mark" id="enter" type="button">Taproot the Game</button>
</main>

<div class="modal" id="auth" hidden>
  <form class="panel auth-card" id="authForm">
    <h2 id="authTitle">Sign in</h2>
    <label for="u">Username</label>
    <input class="name" id="u" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="p">Password</label>
    <input class="name" id="p" type="password" maxlength="128" autocomplete="current-password">
    <p class="err" id="authErr" role="alert"></p>
    <button class="btn" id="authGo" type="submit">Sign in</button>
    <button class="linkbtn" id="authSwap" type="button">Create an account</button>
    <button class="linkbtn" id="authClose" type="button">Cancel</button>
  </form>
</div>

<main class="screen" id="creator" hidden>
  <div class="wrap">
    <div class="top">
      <h2>Create Your Character</h2>
      <div class="who">
        <span id="who"></span>
        <button class="btn ghost" id="logout" type="button">Log out</button>
        <button class="btn ghost" id="back" type="button">Back</button>
      </div>
    </div>
    <div class="grid">
      <section class="panel" aria-label="Preview">
        <div class="stage"><div class="big" id="big"></div></div>
        <p class="caption" id="caption"></p>
        <div class="sizes">
          <div><div class="s1" id="s1"></div><span>Map size</span></div>
          <div><div class="s2" id="s2"></div><span>2&times;</span></div>
        </div>
      </section>
      <section class="panel" aria-label="Customize">
        <div class="grp"><label class="lbl" for="name">Name</label><input class="name" id="name" maxlength="16" value="Aldric" autocomplete="off"></div>
        <div class="grp"><span class="lbl">Class</span><div class="classes" id="cls"></div></div>
        <div class="grp"><span class="lbl">Skin</span><div class="row" id="skin"></div></div>
        <div class="grp"><span class="lbl">Hair</span><div class="row" id="hs"></div></div>
        <div class="grp"><span class="lbl">Hair color</span><div class="row" id="hc"></div></div>
        <div class="actions">
          <span id="saveMsg" role="status"></span>
          <button class="btn ghost" id="rand" type="button">Randomize</button>
          <button class="btn" id="save" type="button">Save</button>
        </div>
      </section>
    </div>
  </div>
</main>

<main class="screen" id="home" hidden>
  <div class="wrap">
    <div class="top">
      <h2>Taproot</h2>
      <div class="who">
        <span id="homeWho"></span>
        <button class="btn ghost" id="armoryBtn" type="button">Armory</button>
        <button class="btn ghost" id="edit" type="button">Edit character</button>
        <button class="btn ghost" id="logout2" type="button">Log out</button>
      </div>
    </div>
    <div class="home-grid">
      <div class="side">
        <section class="panel card" aria-label="Character">
          <div class="portrait"><div id="hSprite"></div></div>
          <h3 id="hName"></h3>
          <p class="sub" id="hClass"></p>
          <div class="lvl"><span>Level 1</span><span>0 / 100 XP</span></div>
          <div class="bar"><i style="width: 0%"></i></div>
        </section>
        <section class="panel" aria-label="Bag">
          <h3 class="h">Bag</h3>
          <ul class="list" id="bag"></ul>
        </section>
      </div>
      <div class="main">
        <section class="panel" aria-label="Explore">
          <h3 class="h">Explore</h3>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
            <a class="btn" href="/game/city/">Enter City</a>
            <a class="btn ghost" href="/game/world/">Explore Fields</a>
          </div>
        </section>
        <section class="panel" aria-label="Map">
          <div class="maphead"><h3 class="h">The City</h3></div>
          <div class="map" id="map"></div>
        </section>
        <section class="panel" aria-label="Quests">
          <h3 class="h">Quests</h3>
          <ul class="list" id="quests"></ul>
        </section>
      </div>
    </div>
  </div>
</main>

<main class="screen" id="armory" hidden>
  <div class="wrap">
    <div class="top">
      <h2>Armory</h2>
      <div class="who">
        <span class="pwr" id="aPwr">PWR 0</span>
        <span id="armSaved" role="status"></span>
        <button class="btn ghost" id="armBack" type="button">Back</button>
      </div>
    </div>
    <div class="home-grid">
      <div class="side">
        <section class="panel card" aria-label="Character">
          <div class="portrait"><div id="aSprite"></div></div>
          <h3 id="aName"></h3>
          <p class="sub" id="aClass"></p>
        </section>
        <section class="panel" aria-label="Traits">
          <h3 class="h">Traits</h3>
          <div id="aStats" class="traits"></div>
        </section>
      </div>
      <div class="main">
        <section class="panel" aria-label="Equipment">
          <h3 class="h" id="aSlotTitle">Select Head Item</h3>
          <div class="slot-tabs" id="aSlotTabs"></div>
          <div class="icards" id="aItems"></div>
          <div class="arm-footer"></div>
        </section>
      </div>
    </div>
  </div>
</main>

<script src="/game/items.js"></script>
<script src="/game/sprite.js"></script>
<script>
  const CLASSES = [['knight', 'Knight'], ['mage', 'Mage'], ['ranger', 'Ranger'], ['rogue', 'Rogue']];
  const { SKINS, HAIRS } = SPRITE;
  const STYLES = [['short', 'Short'], ['long', 'Long'], ['bald', 'Bald']];
  const { ITEMS, SLOTS, STAT_KEYS, STAT_LABELS, SLOT_LABELS, SLOT_ICONS, BASE, RARITIES, RARITY_ORDER, defaultEquipment, migrateEquipment, computeStats, computePower } = GAME;
  const sprite = SPRITE.html;

  const S = { name: 'Aldric', cls: 'knight', skin: 1, hs: 'short', hc: 1, equipment: defaultEquipment('knight') };
  const $ = (id) => document.getElementById(id);

  $('cls').innerHTML = CLASSES.map(([k, n]) => `<button type="button" class="opt cls" data-k="cls" data-v="${k}"><span class="mini" data-mini="${k}"></span><span>${n}</span></button>`).join('');
  $('skin').innerHTML = SKINS.map((c, i) => `<button type="button" class="sw" data-k="skin" data-v="${i}" style="--c:${c}" aria-label="Skin tone ${i + 1}"></button>`).join('');
  $('hs').innerHTML = STYLES.map(([k, n]) => `<button type="button" class="opt" data-k="hs" data-v="${k}">${n}</button>`).join('');
  $('hc').innerHTML = HAIRS.map((c, i) => `<button type="button" class="sw" data-k="hc" data-v="${i}" style="--c:${c}" aria-label="Hair color ${i + 1}"></button>`).join('');

  function update() {
    $('saveMsg').textContent = '';
    $('big').innerHTML = sprite(S);
    $('s1').innerHTML = sprite(S);
    $('s2').innerHTML = sprite(S);
    document.querySelectorAll('[data-mini]').forEach((el) => { el.innerHTML = sprite({ ...S, equipment: defaultEquipment(el.dataset.mini) }); });
    document.querySelectorAll('[data-k]').forEach((b) => b.setAttribute('aria-pressed', String(String(S[b.dataset.k]) === b.dataset.v)));
    const label = CLASSES.find(([k]) => k === S.cls)[1];
    $('caption').innerHTML = `${S.name.trim() || 'Unnamed'}<small>${label}</small>`;
  }

  $('creator').addEventListener('click', (e) => {
    const b = e.target.closest('[data-k]');
    if (!b) return;
    const k = b.dataset.k;
    S[k] = (k === 'skin' || k === 'hc') ? Number(b.dataset.v) : b.dataset.v;
    if (k === 'cls') S.equipment = defaultEquipment(S.cls);
    update();
  });
  $('name').addEventListener('input', (e) => { S.name = e.target.value; update(); });
  $('rand').addEventListener('click', () => {
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    S.cls = pick(CLASSES)[0]; S.equipment = defaultEquipment(S.cls); S.skin = Math.floor(Math.random() * SKINS.length);
    S.hs = pick(STYLES)[0]; S.hc = Math.floor(Math.random() * HAIRS.length);
    update();
  });

  function show(name) {
    ['landing', 'creator', 'home', 'armory'].forEach((n) => { $(n).hidden = n !== name; });
    $('bg').classList.toggle('dim', name !== 'landing');
    window.scrollTo(0, 0);
  }

  const player = { username: '', hasChar: false, inventory: [] };
  const BAG = [['Wood', 12], ['Iron Ore', 4], ['Berries', 7], ['Herbs', 3]];
  const QUESTS = [['Speak to the Gatekeeper', '+20 XP'], ['Gather 10 Wood', '+30 XP'], ['Claim your first plot', '+50 XP']];

  function buildHome() {
    $('bag').innerHTML = BAG.map(([n, q]) => `<li><span>${n}</span><span class="meta">x${q}</span></li>`).join('');
    $('quests').innerHTML = QUESTS.map(([n, r]) => `<li><span>${n}</span><span class="meta">${r}</span></li>`).join('');
    let tiles = '';
    for (let r = 0; r < 7; r++) {
      for (let c = 0; c < 14; c++) {
        const city = c >= 4 && c <= 9 && r >= 1 && r <= 5;
        const keep = c >= 6 && c <= 7 && r >= 2 && r <= 3;
        const plot = city && !keep && (c + r) % 2 === 0;
        const bg = keep ? '#8a8fa0' : plot ? '#5a4f68' : city ? '#4b4358' : (c * 7 + r * 3) % 5 === 0 ? '#2a4233' : '#2f4a3a';
        const edge = plot ? 'box-shadow: inset 0 0 0 1px rgba(212, 169, 79, 0.35);' : '';
        tiles += `<i style="background:${bg};${edge}">${c === 7 && r === 4 ? '<b class="you"></b>' : ''}</i>`;
      }
    }
    $('map').innerHTML = tiles;
  }

  function renderHome() {
    $('hSprite').innerHTML = sprite(S);
    $('hName').textContent = S.name.trim() || player.username;
    $('hClass').textContent = CLASSES.find(([k]) => k === S.cls)[1];
    $('homeWho').textContent = player.username;
  }
  const SESSION = 'taproot_session';
  const getKey = () => { try { return localStorage.getItem(SESSION); } catch (e) { return null; } };
  const setKey = (k) => { try { if (k) localStorage.setItem(SESSION, k); else localStorage.removeItem(SESSION); } catch (e) {} };

  async function api(action, body) {
    const key = getKey();
    const get = action === 'me';
    const res = await fetch('/api/game/' + action, {
      method: get ? 'GET' : 'POST',
      headers: { 'Content-Type': 'application/json', ...(key ? { Authorization: 'Bearer ' + key } : {}) },
      body: get ? undefined : JSON.stringify(body || {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || 'Something went wrong'), { status: res.status });
    return data;
  }

  function enterGame(user) {
    player.username = user.username;
    const allItems = Object.keys(ITEMS);
    const inv = user.inventory || [];
    const missing = allItems.filter((id) => inv.indexOf(id) === -1);
    player.inventory = missing.length ? inv.concat(missing) : inv;
    player.hasChar = !!user.character;
    $('who').textContent = user.username;
    if (user.character) {
      Object.assign(S, user.character);
      var localEq = null;
      try { var lc = JSON.parse(localStorage.getItem('taproot_character')); if (lc && lc.equipment) localEq = lc.equipment; } catch (e) {}
      S.equipment = migrateEquipment({ ...(localEq || user.character.equipment || defaultEquipment(user.character.cls)) });
      try { localStorage.setItem('taproot_character', JSON.stringify(S)); } catch (e) {}
      $('name').value = S.name;
      update();
      renderHome();
      show('home');
    } else {
      update();
      show('creator');
    }
  }

  let mode = 'login';
  function setMode(m) {
    mode = m;
    const login = m === 'login';
    $('authTitle').textContent = login ? 'Sign in' : 'Create account';
    $('authGo').textContent = login ? 'Sign in' : 'Create account';
    $('authSwap').textContent = login ? 'Create an account' : 'I already have an account';
    $('p').autocomplete = login ? 'current-password' : 'new-password';
    $('authErr').textContent = '';
  }
  function openAuth() { setMode('login'); $('auth').hidden = false; $('u').focus(); }

  $('enter').addEventListener('click', async () => {
    if (getKey()) {
      try { enterGame(await api('me')); return; } catch (e) { if (e.status === 401) setKey(null); }
    }
    openAuth();
  });
  $('authSwap').addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));
  $('authClose').addEventListener('click', () => { $('auth').hidden = true; });
  $('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('authErr').textContent = '';
    $('authGo').disabled = true;
    try {
      const d = await api(mode, { username: $('u').value, password: $('p').value });
      setKey(d.key);
      $('p').value = '';
      $('auth').hidden = true;
      enterGame(d);
    } catch (err) {
      $('authErr').textContent = err.message;
    } finally {
      $('authGo').disabled = false;
    }
  });
  $('save').addEventListener('click', async () => {
    $('saveMsg').textContent = 'Saving...';
    try {
      await api('save', { character: S });
      player.hasChar = true;
      try { localStorage.setItem('taproot_character', JSON.stringify(S)); } catch (e) {}
      renderHome();
      show('home');
    } catch (err) { $('saveMsg').textContent = err.status === 401 ? 'Session expired, sign in again' : err.message; }
  });
  ['logout', 'logout2'].forEach((id) => $(id).addEventListener('click', async () => {
    await api('logout').catch(() => {});
    setKey(null);
    try { localStorage.removeItem('taproot_character'); } catch (e) {}
    show('landing');
  }));
  $('edit').addEventListener('click', () => show('creator'));
  $('back').addEventListener('click', () => show(player.hasChar ? 'home' : 'landing'));

  let armTab = 'head';
  let armDirty = false;
  const STAT_MAX = { hp: 250, atk: 30, def: 30, mag: 30, spd: 20 };

  function renderArmory() {
    const eq = S.equipment;
    $('aSprite').innerHTML = sprite(S);
    $('aName').textContent = S.name.trim() || player.username;
    $('aClass').textContent = CLASSES.find(([k]) => k === S.cls)[1];
    $('aPwr').textContent = 'PWR ' + computePower(S.cls, eq);

    const total = computeStats(S.cls, eq);
    $('aStats').innerHTML = STAT_KEYS.map((k) => {
      const bonus = total[k] - BASE[S.cls][k];
      const pct = Math.min(100, Math.round(total[k] / STAT_MAX[k] * 100));
      const bHtml = bonus ? ` <em class="${bonus < 0 ? 'down' : ''}">${bonus > 0 ? '+' : ''}${bonus}</em>` : '';
      return `<div class="trait" data-stat="${k}"><span class="trait-lbl">${STAT_LABELS[k]}</span><div class="trait-bar"><i style="width:${pct}%"></i></div><span class="trait-val">${total[k]}${bHtml}</span></div>`;
    }).join('');

    $('aSlotTabs').innerHTML = SLOTS.map((slot) =>
      `<button type="button" class="slot-tab" data-tab="${slot}" aria-pressed="${armTab === slot}"${eq[slot] ? ' data-filled' : ''}><span class="tab-ico">${SLOT_ICONS[slot]}</span>${SLOT_LABELS[slot]}<span class="eq-dot"></span></button>`
    ).join('');
    $('aSlotTitle').textContent = 'Select ' + SLOT_LABELS[armTab] + ' Item';

    const owned = player.inventory.filter((id) => ITEMS[id] && ITEMS[id].slot === armTab);
    owned.sort((a, b) => RARITY_ORDER.indexOf(ITEMS[a].rarity) - RARITY_ORDER.indexOf(ITEMS[b].rarity));
    const ipwr = (it) => { let p = RARITIES[it.rarity].power; STAT_KEYS.forEach((k) => { p += it.stats[k] || 0; }); return p; };

    $('aItems').innerHTML = owned.map((id) => {
      const it = ITEMS[id];
      return `<button type="button" class="icard ${it.rarity}" data-equip="${id}" aria-pressed="${eq[armTab] === id}">`
        + `<span class="icard-icon">${SLOT_ICONS[armTab]}</span>`
        + `<b class="icard-name">${it.name}</b>`
        + `<span class="icard-rarity">${RARITIES[it.rarity].label}</span>`
        + `<span class="icard-pwr">PWR +${ipwr(it)}</span></button>`;
    }).join('')
    + `<button type="button" class="icard unequip" data-equip="" aria-pressed="${!eq[armTab]}">`
    + `<span class="icard-icon" style="opacity:0.3">❌</span>`
    + `<b class="icard-name">No Item</b><span class="icard-rarity" style="background:transparent;color:var(--dim)">Unequip</span>`
    + `<span class="icard-pwr">PWR +0</span></button>`;
  }

  let saveQueue = Promise.resolve();
  function persistArmory() {
    try { localStorage.setItem('taproot_character', JSON.stringify(S)); } catch (e) {}
    $('armSaved').textContent = 'Saving...';
    saveQueue = saveQueue
      .then(() => api('save', { character: S }))
      .then(() => { $('armSaved').textContent = 'Saved'; armDirty = false; })
      .catch((err) => { $('armSaved').textContent = err.status === 401 ? 'Session expired' : err.message; });
  }

  $('armory').addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab], [data-equip]');
    if (!t) return;
    if ('tab' in t.dataset) { armTab = t.dataset.tab; renderArmory(); return; }
    if ('equip' in t.dataset) {
      const id = t.dataset.equip;
      S.equipment[armTab] = (id && S.equipment[armTab] !== id) ? id : null;
      armDirty = true;
      try { localStorage.setItem('taproot_character', JSON.stringify(S)); } catch (e) {}
      renderArmory();
    }
  });
  $('armoryBtn').addEventListener('click', () => { armDirty = false; $('armSaved').textContent = ''; renderArmory(); show('armory'); });
  $('armBack').addEventListener('click', () => {
    if (armDirty) persistArmory();
    renderHome(); update(); show('home');
  });

  buildHome();
  update();
</script>
</body>
</html>
