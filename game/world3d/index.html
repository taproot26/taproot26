<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taproot Overworld 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: rgba(36, 10, 50, 0.88); --rim: #4a1a62; --glow: rgba(255, 63, 180, 0.45);
    --lime: #c8ff2e; --lime-dk: #6a9a00; --pink: #ff3fb4; --orange: #ffb03a; --gold: #ffcf3a; --sky: #5ab4ff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7a1a8a; color: #fff; font-family: 'Nunito', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  #scene.drag { cursor: grabbing; }
  .ui, .tag, .float, .chip, .pill, .nitro, button { font-family: 'Lilita One', system-ui, sans-serif; letter-spacing: 0.3px; }
  .panel { position: fixed; z-index: 3; background: var(--panel); border: 2px solid var(--rim); border-radius: 18px; box-shadow: 0 0 0 2px var(--glow), 0 8px 22px rgba(0, 0, 0, 0.35); }

  /* top-left: area + HP */
  .tl { left: 12px; top: 12px; padding: 10px 14px 10px 10px; display: flex; gap: 10px; align-items: center; width: min(340px, calc(100% - 172px)); }
  .avatar { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 3px solid #2a0a3a; background: radial-gradient(circle at 35% 30%, #d8ff5a, #7ac400) no-repeat; image-rendering: pixelated; }
  .tl-body { min-width: 0; flex: 1; }
  .title { font: 400 19px/1.1 'Lilita One', system-ui, sans-serif; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hp { position: relative; margin-top: 6px; height: 18px; border-radius: 10px; background: #1a0624; border: 2px solid #12031a; overflow: hidden; }
  #hpFill { height: 100%; width: 100%; background: linear-gradient(#e2ff7a, #8ad400); box-shadow: 0 0 10px rgba(200, 255, 46, 0.7); transition: width 0.2s; }
  #hpText { position: absolute; inset: 0; display: grid; place-items: center; font: 400 12px/1 'Lilita One', sans-serif; text-shadow: 0 1px 2px #000; }
  .links { margin-top: 6px; font: 800 12px/1.2 'Nunito', sans-serif; color: #e7c9f2; }
  .links a { color: #fff; text-decoration: none; border-bottom: 1px dashed rgba(255, 255, 255, 0.5); }

  /* top-centre: nearest exit */
  .chip { position: fixed; z-index: 3; left: 50%; top: 10px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 5px 16px 5px 6px; font-size: 18px;
    background: var(--panel); border: 2px solid var(--rim); border-radius: 999px; box-shadow: 0 0 0 2px var(--glow); white-space: nowrap; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
  .chip .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--orange); color: #3a1200; font-size: 14px; text-shadow: none; }

  /* top-right: minimap + counters */
  .mini { position: fixed; z-index: 3; right: 12px; top: 10px; width: 180px; height: 180px; border-radius: 50%; padding: 5px; background: #12031a; box-shadow: 0 0 0 3px #2a0a3a, 0 0 18px rgba(200, 255, 46, 0.35); }
  #minimap { width: 100%; height: 100%; display: block; }
  .mini-label { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font: 400 16px/1 'Lilita One', sans-serif; white-space: nowrap; text-shadow: 0 2px 0 #000, 0 0 6px #000; }
  .pills { position: fixed; z-index: 3; right: 12px; top: 200px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .pill { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 18px; border-radius: 999px; background: #160a2e; border: 3px solid #2a1650; box-shadow: 0 0 0 2px var(--c, #5ab4ff), 0 0 14px var(--c, #5ab4ff); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
  .pill .lv { color: var(--gold); }
  .pill i { font-style: normal; color: #d8c8ff; font-size: 15px; }

  /* bottom-right: nitro + actions */
  .nitro { position: fixed; z-index: 3; right: 108px; bottom: 26px; display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px; background: #120a1e; border: 3px solid #23103a; box-shadow: 0 0 0 2px var(--lime), 0 0 16px rgba(200, 255, 46, 0.5); font-size: 18px; color: var(--lime); }
  .nitro .bar { width: 90px; height: 10px; border-radius: 6px; background: #2a2a1a; overflow: hidden; }
  #nitroFill { height: 100%; width: 100%; background: var(--lime); box-shadow: 0 0 8px var(--lime); }
  #nitroText { color: #fff; min-width: 52px; text-align: right; }
  .actions { position: fixed; z-index: 3; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .actions button { cursor: pointer; touch-action: manipulation; border: 3px solid #2a0a3a; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4); }
  #camBtn { padding: 6px 12px; border-radius: 999px; font-size: 15px; background: #241040; box-shadow: 0 3px 0 #12031a, 0 0 12px rgba(255, 63, 180, 0.4); }
  .toast { top: auto; bottom: 90px; padding: 8px 18px; }
  #bagBtn { padding: 6px 12px; border-radius: 999px; font-size: 15px; color: #1e3000; text-shadow: none; background: linear-gradient(#e6ff7a, #a8e000); box-shadow: 0 3px 0 var(--lime-dk), 0 0 12px rgba(200, 255, 46, 0.5); }
  #sailBtn { padding: 8px 14px; border-radius: 999px; font-size: 16px; color: #1a2a40; text-shadow: none; background: linear-gradient(#bff0ff, #4ab8e8); box-shadow: 0 3px 0 #1a5a8a, 0 0 14px rgba(90, 200, 255, 0.6); }
  #jumpBtn { width: 58px; height: 58px; border-radius: 50%; font-size: 15px; color: #1e3000; text-shadow: none; background: radial-gradient(circle at 35% 30%, #f0ff9a, #a8e000 70%); box-shadow: 0 4px 0 var(--lime-dk), 0 0 16px rgba(200, 255, 46, 0.6); }
  #attackBtn { width: 78px; height: 78px; border-radius: 50%; font-size: 34px; background: radial-gradient(circle at 35% 30%, #ff9ae4, #e0209a 70%); box-shadow: 0 4px 0 #8a0a5a, 0 0 22px rgba(255, 63, 180, 0.7); }
  .actions button:active { transform: translateY(2px); }
  .actions kbd { font: 700 10px monospace; opacity: 0.7; margin-left: 4px; }

  /* bottom-left: controls */
  .help { position: fixed; z-index: 3; left: 12px; bottom: 12px; padding: 8px 14px; font: 800 13px/1.3 'Nunito', sans-serif; border-radius: 999px; background: var(--panel); border: 2px solid var(--rim); box-shadow: 0 0 0 2px var(--glow); }
  .help b { font-family: 'Lilita One', sans-serif; font-weight: 400; color: var(--lime); }

  /* bag */
  .bag { position: fixed; z-index: 4; right: 12px; top: 330px; width: 260px; padding: 12px; }
  .bag-head { display: flex; justify-content: space-between; align-items: center; font: 400 20px/1 'Lilita One', sans-serif; margin-bottom: 10px; }
  .bag-head span { display: flex; align-items: center; gap: 4px; font-size: 16px; color: var(--gold); }
  .bag-head img, .bag-item img { image-rendering: pixelated; }
  .bag-head img { width: 20px; height: 20px; }
  .bag-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .bag-item { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 4px 6px; background: #1a0828; border: 2px solid #4a1a62; border-radius: 10px; font: 800 12px/1.2 'Nunito', sans-serif; }
  .bag-item img { width: 30px; height: 30px; flex: none; }
  .bag-item span { min-width: 0; }
  .bag-item b { margin-left: auto; font-family: 'Lilita One', sans-serif; font-weight: 400; color: var(--lime); }
  .bag-item.use { cursor: pointer; }
  .bag-item.use:hover { border-color: var(--lime); }
  .bag-item .emo { width: 30px; text-align: center; font-size: 22px; flex: none; }
  .shop { position: fixed; z-index: 8; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, 94vw); max-height: 80vh; display: flex; flex-direction: column;
    background: #f6efdc; color: #3a2416; border: 4px solid #4a2c18; border-radius: 16px; box-shadow: 0 6px 0 #2a1a10, 0 14px 40px rgba(0, 0, 0, 0.5); font: 700 14px/1.3 'Nunito', sans-serif; }
  .shop-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 4px; font: 400 22px/1 'Lilita One', sans-serif; }
  .shop-head span { margin-left: auto; color: #8a5a10; font-size: 18px; }
  .shop-head button { border: 0; background: #4a2c18; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 15px; cursor: pointer; }
  .shop-greet { margin: 0 14px 8px; color: #7a5a3a; font-style: italic; }
  .shop-tabs { display: flex; gap: 6px; padding: 0 14px 8px; }
  .shop-tabs:empty { display: none; }
  .shop-tabs button { flex: 1; padding: 7px; border: 2px solid #c8b088; border-radius: 10px; background: #ece0c0; color: #4a2c18; font: 400 16px 'Lilita One', sans-serif; cursor: pointer; }
  .shop-tabs button.on { background: #4a2c18; color: #fff2d0; border-color: #4a2c18; }
  .shop-list { overflow-y: auto; padding: 0 14px 14px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 9px; background: #ece0c0; border: 2px solid #c8b088; border-radius: 10px; }
  .row .ico { width: 34px; height: 34px; flex: none; display: grid; place-items: center; font-size: 22px; border-radius: 8px; background: #fff8e6; }
  .row .ico img { width: 30px; height: 30px; image-rendering: pixelated; }
  .row .txt { flex: 1; min-width: 0; }
  .row .txt b { display: block; font: 400 16px 'Lilita One', sans-serif; }
  .row .txt small { color: #7a5a3a; }
  .row .need { color: #3f8a3a; } .row .need.miss { color: #b8322e; }
  .row button { flex: none; padding: 7px 12px; border: 0; border-radius: 999px; background: #3f8a3a; color: #fff; font: 400 14px 'Lilita One', sans-serif; cursor: pointer; box-shadow: 0 2px 0 #1f4a1f; }
  .row button.alt { background: #8a5a10; box-shadow: 0 2px 0 #4a2c08; }
  .row button:disabled { background: #b8a888; box-shadow: none; cursor: default; }
  .shop-empty { margin: 8px 0; color: #7a5a3a; }
  .bag-empty { grid-column: 1 / -1; margin: 0; font: 700 13px/1.3 'Nunito', sans-serif; color: #c8b0d8; }

  /* world-anchored labels */
  #labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); padding: 3px 12px 5px; text-align: center; white-space: nowrap; border-radius: 12px;
    background: rgba(28, 8, 40, 0.88); border: 2px solid rgba(255, 176, 58, 0.55); font-size: 15px; color: var(--orange); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
  .tag small { display: block; font-size: 12px; color: #fff; }
  .tag .thp { height: 5px; margin-top: 3px; border-radius: 3px; background: #2a0a1a; overflow: hidden; }
  .tag .thp i { display: block; height: 100%; background: var(--lime); }
  .tag.gate { border-color: rgba(200, 255, 46, 0.6); color: var(--lime); }
  .tag.sign { font-size: 17px; color: #fff; border-color: rgba(255, 63, 180, 0.7); box-shadow: 0 0 12px rgba(255, 63, 180, 0.45); }
  .tag.wood { background: #7a4a28; border-color: #3a2414; color: #fff2d0; box-shadow: 0 3px 0 #3a2414; }
  .tag small { max-width: 260px; white-space: normal; }
  .float { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); font-size: 20px; white-space: nowrap; text-shadow: 0 2px 0 #1a0a1a, 0 0 6px rgba(0, 0, 0, 0.6); }
  #fade { position: fixed; inset: 0; z-index: 9; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.7s; }

  @media (max-width: 640px) {
    .mini { width: 124px; height: 124px; }
    .mini-label { font-size: 12px; bottom: 6px; }
    .pills { top: 142px; gap: 6px; }
    .pill { font-size: 14px; padding: 4px 10px; }
    .help { display: none; }
    .nitro { right: auto; left: 12px; bottom: 16px; font-size: 14px; padding: 6px 12px; }
    .nitro .bar { width: 60px; }
    .bag { top: 270px; width: min(260px, calc(100% - 24px)); }
    .tl { width: calc(100% - 156px); }
    .title { font-size: 16px; }
    .links { display: none; }
  }
</style>
<script>
if (!localStorage.getItem('taproot_session')) window.location.replace('/game/');
</script>

<body>
<canvas id="scene"></canvas>

<div class="panel tl">
  <div class="avatar" aria-hidden="true"></div>
  <div class="tl-body">
    <div class="title" id="areaTitle">Taproot Fields</div>
    <div class="hp"><div id="hpFill"></div><span id="hpText"></span></div>
    <div class="links"><a href="/game/">Back</a></div>
  </div>
</div>
<div class="chip" id="nearChip" hidden><span class="dot">&#10140;</span><span id="nearText"></span></div>

<div class="mini"><canvas id="minimap" width="240" height="240" aria-label="Minimap"></canvas><div class="mini-label" id="miniLabel"></div></div>
<div class="pills">
  <div class="pill" style="--c: #ffb03a"><span>&#127942;</span><b class="lv" id="lvText">Lv 1</b><i id="xpText">0/100 XP</i></div>
  <div class="pill" style="--c: #ffcf3a"><span>&#128176;</span><b id="goldText">0</b></div>
  <div class="pill" style="--c: #5ab4ff"><span>&#11088;</span><b id="killText">0</b></div>
</div>

<div class="nitro"><span>&#9889;</span>NITRO<div class="bar"><div id="nitroFill"></div></div><span id="nitroText">Ready</span></div>
<div class="actions">
  <button id="sailBtn" type="button" tabindex="-1" hidden>&#9973; Set sail<kbd>F</kbd></button>
  <button id="camBtn" type="button" tabindex="-1" aria-label="Camera view">&#127909;<kbd>C</kbd></button>
  <button id="bagBtn" type="button" tabindex="-1">Bag<kbd>B</kbd></button>

<div class="shop" id="shopPanel" hidden>
  <div class="shop-head"><b id="shopTitle"></b><span id="shopGold"></span><button id="shopClose" type="button" aria-label="Close">&#10005;</button></div>

</div>

  <div class="bag-head">Bag <span id="bagGold"></span></div>
  <div class="bag-grid" id="bagGrid"></div>
</div>
<div id="fade"></div>

<script type="module">
/* ============================================================================
   Taproot overworld in Three.js: the Phaser overworld (/game/world/) rebuilt as
   a neon low-poly toon world with a third-person chase camera.

   Same areas, collision grid, monsters, loot, XP and save key (taproot_field)
   as the 2D page, so progress carries between the two. 1 tile = 1 world unit:
   x = tile column, z = tile row. The world queries (pathEdge, waterAt, ...) are
   kept in the 2D page's pixel space (16 px per tile) so layouts match exactly.

   Static props are merged into a handful of meshes (one per material) at load;
   the player, monsters, drops and effects are ordinary meshes.
   ============================================================================ */
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { makeHero3D } from '/game/lib/hero3d.js';
import { SHOPS, SELL, RECIPES, CONSUMABLES } from './shops.js';

const AREA = new URLSearchParams(location.search).get('area');
const T = 16;
const MINI = 4; // minimap pixels per tile

/* ---------- areas (copied from /game/world/, exits point at the 3D pages) ---------- */
const borderTrees = (edges, W = 48, H = 36) => {
  const t = [];
  if (edges.includes('n')) for (let x = 0; x < W; x += 2) t.push([x, 0]);
  if (edges.includes('s')) for (let x = 0; x < W; x += 2) t.push([x, H - 2]);
  if (edges.includes('w')) for (let y = 2; y < H - 2; y += 2) t.push([0, y]);
  if (edges.includes('e')) for (let y = 2; y < H - 2; y += 2) t.push([W - 2, y]);
  return t;
};
const AREAS = {
  fields: {
    title: 'Taproot Fields',
    paths: [
      [38.5, 7.3, 38.5, 10.5, 1.4], [38.5, 10.5, 34, 12.2, 1.5], [34, 12.2, 28, 13.2, 1.7],
      [28, 13.2, 24.5, 16.5, 2.0], [24.5, 16.5, 24.5, 21, 2.4], [24.5, 21, 25.5, 22.5, 2.2],
      [0, 19, 6, 19.5, 2.6], [6, 19.5, 10, 23.5, 2.4], [10, 23.5, 16, 28, 2.3], [16, 28, 20, 33, 2.4], [20, 33, 21, 36, 2.4],
      [24.5, 21, 20, 25, 2.0], [20, 25, 16, 28, 2.0],
      [4, 15.5, 8, 14.6, 1.4], [8, 14.6, 13, 13.5, 1.5], [13, 13.5, 17, 11, 1.6],
      [19.5, 31, 26, 33.2, 1.0], [26, 33.2, 36, 33.2, 0.9],
    ],
    ponds: [
      { cx: 5.5, cy: 5.6, rx: 5.6, ry: 3.5 },
      { cx: 0.5, cy: 32.2, rx: 5.2, ry: 4.4 },
      { cx: 47.5, cy: 33.5, rx: 5.2, ry: 4.6, murky: true },
    ],
    tall: [[11, 15, 21, 23, 'g'], [34, 15, 44, 23, 'g'], [28, 3, 35, 9, 'g'], [24, 28, 29, 33, 'g'], [10, 30, 14, 33, 'd'], [2, 22, 6, 26, 'd']],
    objects: [['house_a', 36, 3, 5, 4], ['house_b', 2, 12, 4, 3], ['cave_entrance', 34, 31, 4, 2]],
    doors: [{ x: 35, y: 32, w: 2, h: 1, href: '/game/world3d/?area=cave&from=fields', name: 'Taproot Mine' }],
    start: { x: 24, y: 19 },
    bushes: [[10, 11], [2, 17], [44, 9], [45, 20], [7, 28], [9, 30], [8, 33], [11, 29], [6, 31], [36, 34], [39, 33], [43, 27], [14, 22], [27, 10]],
    stumps: [[22, 8, 'tall'], [31, 18, 'short'], [8, 20, 'short'], [41, 12, 'tall'], [18, 30, 'short']],
    flowers: [[15, 5], [10, 9], [1, 22], [3, 17], [7, 31], [34, 28], [37, 29], [40, 28], [45, 9], [46, 19], [30, 30], [19, 27], [15, 31], [33, 10], [27, 10], [4, 25], [12, 16]],
    trees: (() => {
      const t = borderTrees('n');
      [13, 15, 17, 19, 21, 23, 25, 44, 46].forEach((x) => t.push([x, 2]));
      [[33, 2], [44, 4], [46, 4], [46, 8], [46, 10], [12, 4], [0, 10], [0, 12], [2, 9], [0, 14], [0, 23], [0, 25], [2, 24], [9, 17], [22, 9],
       [46, 15], [46, 25], [46, 22], [32, 32], [35, 31], [38, 32], [7, 34], [9, 34], [11, 34], [13, 34], [15, 34], [8, 32], [12, 31],
       [44, 6], [46, 6], [18, 5], [16, 8], [20, 10], [32, 17], [31, 22], [33, 23], [27, 2], [29, 1], [30, 28], [20, 29]].forEach((p) => t.push(p));
      for (let x = 25; x < 48; x += 2) t.push([x, 34]);
      return t;
    })(),
    treeKind: (x, y) => (hash(x, y, 61) > 0.3 ? 'tree_pine' : 'tree_round'),
    fences: [[40, 47, 13], [26, 39, 25], [41, 47, 25]],
    exits: [{ edge: 'n', range: [22, 25], href: '/game/world3d/?area=city&from=world', name: 'Taproot City' }],
    arrive: { city: { x: 23.5, y: 1 }, cave: { x: 33, y: 33 } },
    spawn: ['slime', 'slime', 'slime', 'slime', 'shroom', 'shroom', 'shroom', 'bat', 'bat', 'goblin', 'goblin', 'king'],
  },

  woods: {
    title: 'Taproot Woods',
    ground: 'forest',
    paths: [
      [48, 17.5, 41, 16.5, 1.3], [41, 16.5, 33, 18.5, 1.1], [33, 18.5, 25, 17, 1.1], [25, 17, 17, 19.5, 1.1],
      [17, 19.5, 8, 18.5, 1.1], [8, 18.5, 0, 18.5, 1.3],

/* ---------- stitched maps: neighbouring areas laid side by side in one scene, so you walk (and
   see) straight across instead of warping. Each part keeps its own layout, offset by (ox, oy) tiles;
   the edges they share ('open') lose their border trees and the exits between them. ---------- */
function stitch(title, size, parts) {
  const S = { title, size, town: true, sky: 'day', paths: [], ponds: [], tall: [], objects: [], bushes: [], stumps: [], flowers: [], trees: [], fences: [],
    plots: [], fenceRects: [], clearings: [], planks: [], decorList: [], npcs: [], doors: [], exits: [], arrive: {}, spawn: [], regions: [], parts: [],
    treeKind: () => 'tree_round' };
  // per-tile lookups (sea, beach, ground style) go to whichever part covers the tile, in its own coords
  const local = (k) => (tx, ty) => { const p = S.partAt(tx, ty); return !!(p && p.a[k] && p.a[k](tx - p.ox, ty - p.oy)); };
  S.sea = local('sea');
  S.beach = local('beach');
  for (const { a, ox, oy, open = '' } of parts) {
    const [W, H] = a.size || [48, 36], box = [ox, oy, ox + W, oy + H];
    const pt = ([x, y, ...r]) => [x + ox, y + oy, ...r];
    const rect = ([x1, y1, x2, y2, ...r]) => [x1 + ox, y1 + oy, x2 + ox, y2 + oy, ...r];
    S.parts.push({ a, ox, oy, box });
    S.start ||= { x: a.start.x + ox, y: a.start.y + oy };
    S.planks.push(...(a.planks || []).map(rect));
    Object.entries(a.decor || {}).forEach(([key, count]) => S.decorList.push({ key, count, box }));
    if (a.sailing) Object.assign(S, { sailing: true, fish: a.fish, harbour: [ox, oy] });
    S.paths.push(...a.paths.map(rect));
    S.ponds.push(...a.ponds.map((p) => ({ ...p, cx: p.cx + ox, cy: p.cy + oy })));
    for (const k of ['tall', 'plots', 'fenceRects']) S[k].push(...(a[k] || []).map(rect));
    S.objects.push(...a.objects.map(([k, x, y, ...r]) => [k, x + ox, y + oy, ...r]));
    for (const k of ['bushes', 'stumps', 'flowers', 'clearings']) S[k].push(...(a[k] || []).map(pt));
    S.trees.push(...a.trees.filter(([x, y]) => !(open.includes('n') && y <= 1 || open.includes('s') && y >= H - 3 || open.includes('w') && x <= 1 || open.includes('e') && x >= W - 3))
      .map(([x, y, k]) => [x + ox, y + oy, k || a.treeKind(x, y)]));
    S.fences.push(...(a.fences || []).map(([x1, x2, y]) => [x1 + ox, x2 + ox, y + oy]));
    S.npcs.push(...(a.npcs || []).map(([n, s, x, z, ...r]) => [n, s, x + ox, z + oy, ...r]));
    S.doors.push(...(a.doors || []).map((d) => ({ ...d, x: d.x + ox, y: d.y + oy })));
    S.exits.push(...a.exits.filter((e) => !open.includes(e.edge)).map((e) => ({ ...e, range: e.range.map((v) => v + (e.edge === 'n' || e.edge === 's' ? ox : oy)) })));
    for (const [k, p] of Object.entries(a.arrive || {})) S.arrive[k] ||= { x: p.x + ox, y: p.y + oy };
    S.spawn.push(...(a.spawn || []).map((type) => ({ type, box }))); // monsters stay in their own district
    if (a.grid) S.grid = { ...a.grid, xs: a.grid.xs.map((v) => v + ox), ys: a.grid.ys.map((v) => v + oy), box: [ox, oy, ox + W, oy + H] };
    S.regions.push({ title: a.title, box: [ox, oy, ox + W, oy + H] });
  }
  const [MW, MH] = size, owner = new Int16Array(MW * MH).fill(-1); // first part listed wins a tile
  S.parts.forEach(({ box: [x1, y1, x2, y2] }, i) => {
    for (let y = Math.max(0, y1); y < Math.min(MH, y2); y++) for (let x = Math.max(0, x1); x < Math.min(MW, x2); x++) if (owner[y * MW + x] < 0) owner[y * MW + x] = i;
  });
  S.partAt = (tx, ty) => { const x = Math.floor(tx), y = Math.floor(ty); return x >= 0 && y >= 0 && x < MW && y < MH ? S.parts[owner[y * MW + x]] : undefined; };
  S.groundAt = (tx, ty) => { const p = S.partAt(tx, ty); return !p ? 'grass' : p.a.town ? 'town' : p.a.ground || 'grass'; };
  return S;
}

// The overworld is one map, west to east: docks, woods, then the city with the Avenues blocks
// north of it and the fields south of it. Forest fills the north and east edges, and the sea
// runs from the docks along the south coast to a beach below the woods, where the fields' west
// path comes out. A new avenue runs along the City/Avenues seam (road at y 51) and a grove fills
// the corner east of the old town.
{
  const wilds = (title, [W, H], seed, extra = {}) => ({
    title, size: [W, H], ground: 'forest', paths: [], ponds: [], tall: [], objects: [], bushes: [], stumps: [], flowers: [], exits: [], spawn: [],
    start: { x: 2, y: 2 }, treeKind: (x, y) => (hash(x, y, 61) < 0.55 ? 'tree_pine' : 'tree_oak'),
    trees: (() => {
      const t = [];
      for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (hash(x + seed, y, 94) < 0.82) t.push([x + (hash(x, y, 95) > 0.5 ? 1 : 0), y]);
      return t;
    })(),
    ...extra,
  });
  const shore = (x) => (x < 46 ? -2 : Math.min(30, 2 + (x - 46) * 0.62) + Math.sin(x * 0.35) * 1.1);
  const palms = [];
  const shorePaths = [[96, 19, 84, 18, 2.0], [84, 18, 74, 15.5, 1.6]];
  for (let x = 50; x < 94; x += 5) {
    const px = x + Math.floor(hash(x, 1, 97) * 3), py = Math.floor(shore(x) - 4 - hash(x, 2, 97) * 2);
    if (shorePaths.every((sg) => distSeg(px + 1, py + 0.5, sg) - sg[4] > 1.5)) palms.push(['palm', px, py, 2, 1]);
  }
  const north = wilds('Taproot Wilds', [96, 52], 1, {
    ponds: [{ cx: 30, cy: 22, rx: 6, ry: 4 }], clearings: [[30, 22, 10], [64, 30, 6]], tall: [[60, 27, 68, 33, 'g']],
    decor: { fern: 160, mushrooms: 40 }, spawn: ['shroom', 'bat', 'bat'],
  });
  const east = wilds('Taproot Wilds', [16, 36], 2);
  const south = {
    title: 'Taproot Shore', size: [96, 36], paths: shorePaths, ponds: [], tall: [],

// walk-through mine decor (no collision)
// Town pieces in the Phaser city's style: half-timbered cottages with tile roofs, flower boxes and
// blue windows; striped market stalls; a stone town hall with a clock tower; stone fountain and well.
const ROOFS = ['#c4553a', '#3f5ea8', '#4f8a3a', '#6a4a9a'];
const TOWN_BUILD = {
  cottage(w, d, roof, stone, floors = 1) {
    const W = w - 0.7, D = d - 0.7, H = 2.3 + (floors - 1) * 1.4, f = D / 2 + 0.01, wall = stone ? '#b2ac9e' : '#ecdcb8', beam = '#6a4426';
    put('toon', 'box', '#8c8478', 0, 0.25, 0, W + 0.16, 0.5, D + 0.16);
    put('toon', 'box', wall, 0, 0.5 + (H - 0.5) / 2, 0, W, H - 0.5, D);
    put('toon', 'box', wall, 0, H, 0, W, D / Math.SQRT2, D / Math.SQRT2, Math.PI / 4, 0, 0); // attic gables
    if (!stone) {
      for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) put('toon', 'box', beam, x * W / 2, 0.5 + (H - 0.5) / 2, z * D / 2, 0.14, H - 0.5, 0.14);
      for (const y of floors > 1 ? [0.55, H / 2 + 0.3, H] : [0.55, H]) for (const k of [-1, 1]) put('toon', 'box', beam, 0, y, k * f, W + 0.04, 0.12, 0.06);
      for (const k of [-1, 1]) put('toon', 'box', beam, k * W * 0.3, 1.45, f + 0.01, 0.1, 1.5, 0.05, 0, 0, k * 0.55);
    }
    const run = D / 2 + 0.38, L = run * Math.SQRT2;
    for (const k of [-1, 1]) put('toon', 'box', roof, 0, H + D / 2 - run / 2, k * run / 2, W + 0.55, 0.16, L, k * Math.PI / 4, 0, 0);
    put('toon', 'box', mixHex(roof, '#2a1a20', 0.35), 0, H + D / 2 + 0.03, 0, W + 0.6, 0.14, 0.22);
    put('toon', 'box', '#8c8478', W / 4, H + D / 2 - 0.1, -D / 6, 0.42, 1.2, 0.42);
    put('toon', 'box', '#5a5652', W / 4, H + D / 2 + 0.52, -D / 6, 0.48, 0.1, 0.48);
    // door with frame and step
    put('toon', 'box', beam, 0, 0.95, f, 0.95, 1.5, 0.08);
    put('toon', 'box', '#8a5230', 0, 0.92, f + 0.03, 0.75, 1.36, 0.06);
    put('toon', 'sph', '#e0b048', 0.24, 0.9, f + 0.08, 0.04);
    put('toon', 'box', '#8c8478', 0, 0.06, f + 0.3, 1.2, 0.12, 0.5);
    // windows: wood frame, blue glass, flower box
    const xs = W > 3.4 ? [-W / 3, W / 3] : [-W / 3.2, W / 3.2];
    for (const fy of floors > 1 ? [1.55, H - 0.55] : [1.6]) for (const x of xs) {
      put('toon', 'box', beam, x, fy, f + 0.01, 0.74, 0.74, 0.07);
      put('toon', 'box', '#7aaee0', x, fy, f + 0.04, 0.56, 0.56, 0.05);
      put('toon', 'box', beam, x, fy, f + 0.07, 0.05, 0.56, 0.03);
      put('toon', 'box', beam, x, fy, f + 0.07, 0.56, 0.05, 0.03);
      put('toon', 'box', '#7a4a28', x, fy - 0.44, f + 0.12, 0.72, 0.14, 0.18);
      for (let i = 0; i < 4; i++) put('toon', 'sph', ['#ff7aa8', '#ffe066', '#ffffff', '#c08aff'][i], x - 0.26 + i * 0.17, fy - 0.33, f + 0.14, 0.06);
    }
    for (const k of [-1, 1]) {
      put('toon', 'box', beam, k * (W / 2 + 0.01), 1.6, 0, 0.07, 0.7, 0.7);
      put('toon', 'box', '#7aaee0', k * (W / 2 + 0.04), 1.6, 0, 0.05, 0.52, 0.52);
    }
  },
  house_a(r, w, d) { TOWN_BUILD.cottage(w, d, ROOFS[Math.floor(r * 4)], false); },
  house_b(r, w, d) { TOWN_BUILD.cottage(w, d, ROOFS[(Math.floor(r * 4) + 1) % 4], r > 0.5); },
  tavern(r, w, d) {
    TOWN_BUILD.cottage(w, d, '#4f8a3a', false, 2);
    const W = w - 0.7, f = (d - 0.7) / 2;
    for (let i = 0; i < 7; i++) put('toon', 'box', i % 2 ? '#f2ead8' : '#3f8a3a', -W / 2 + (i + 0.5) * (W / 7), 2.0, f + 0.45, W / 7, 0.06, 0.9, 0.4, 0, 0);
    put('toon', 'cyl', '#8a5a32', W / 2 - 0.2, 0.42, f + 0.6, 0.3, 0.84, 0.3);
    put('toon', 'cyl', '#8a5a32', W / 2 - 0.85, 0.42, f + 0.7, 0.3, 0.84, 0.3);
  },
  stall(w, d, a, b, goods) {
    const W = w - 0.6, D = d - 0.6, f = D / 2;
    put('toon', 'box', '#8a5a32', 0, 1.1, -f + 0.1, W, 2.2, 0.14);
    for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) put('toon', 'box', '#6a4426', x * (W / 2 - 0.07), 1.15, z * (f - 0.07), 0.14, 2.3, 0.14);
    put('toon', 'box', '#9a6a3a', 0, 0.45, f - 0.35, W - 0.3, 0.9, 0.55);
    put('toon', 'box', '#b07a48', 0, 0.92, f - 0.35, W - 0.2, 0.08, 0.65);
    const n = 8;
    for (let i = 0; i < n; i++) put('toon', 'box', i % 2 ? b : a, -W / 2 - 0.15 + (i + 0.5) * ((W + 0.3) / n), 2.3, 0.1, (W + 0.3) / n, 0.07, D + 0.5, 0.18, 0, 0);
    for (let i = 0; i < n; i++) put('toon', 'box', i % 2 ? b : a, -W / 2 - 0.15 + (i + 0.5) * ((W + 0.3) / n), 2.05, f + 0.38, (W + 0.3) / n, 0.32, 0.05);
    put('toon', 'box', '#6a4426', 0, 2.75, f + 0.05, Math.min(1.8, W * 0.6), 0.42, 0.08);
    put('toon', 'box', '#a8784a', 0, 2.75, f + 0.1, Math.min(1.6, W * 0.55), 0.3, 0.04);
    goods.forEach((c, i) => put('toon', 'sph', c, -W * 0.32 + (i % 5) * W * 0.16, 1.05 + Math.floor(i / 5) * 0.02, f - 0.45 + Math.floor(i / 5) * 0.2, 0.11));
  },
  shop(r, w, d, name = '') {
    if (/potion/i.test(name)) TOWN_BUILD.stall(w, d, '#7a4aa8', '#f2ead8', ['#c06aff', '#5ab4ff', '#ff4a6a', '#6aff8a', '#ffd23a', '#c06aff', '#5ab4ff']);
    else if (/seed/i.test(name)) TOWN_BUILD.stall(w, d, '#3f8a3a', '#f2ead8', ['#8a6440', '#e8c860', '#6aa83f', '#8a6440', '#e8c860']);
    else TOWN_BUILD.stall(w, d, '#c8383a', '#f2ead8', ['#e0402e', '#f0952a', '#7ac23a', '#ffd84a', '#e0402e', '#f0952a', '#7ac23a']);
  },
  armoury(r, w, d) { // the smithy: stone cottage, red roof, anvil and forge glow out front
    TOWN_BUILD.cottage(w, d, '#b8432e', true);
    const f = (d - 0.7) / 2;
    put('toon', 'box', '#3a3638', 1.2, 0.35, f + 0.8, 0.5, 0.2, 0.25);
    put('toon', 'box', '#4a4648', 1.2, 0.18, f + 0.8, 0.25, 0.36, 0.2);
    put('toon', 'box', '#6a6260', -1.3, 0.45, f + 0.75, 0.7, 0.9, 0.6);
    put('glow', 'box', '#ff7a2a', -1.3, 0.55, f + 1.06, 0.4, 0.25, 0.02);
  },

// ground: a thick slab, with each painted chunk laid on top as its own textured plane
const seaMat = DAY ? toon({ color: '#3f86d8', emissive: '#0a2850' }) : toon({ color: '#4a2ac0', emissive: '#1a0a50' });
{
  const side = toon({ color: UNDER ? '#1a1424' : '#6a5038' });
  const g = new THREE.Mesh(new THREE.BoxGeometry(MAP_W, 2, MAP_H), side);
  g.position.set(MAP_W / 2, -1.001, MAP_H / 2);
  g.receiveShadow = true;
  scene.add(g);
  const px2tile = 1 / (S * T);
  for (const ch of groundChunks) {
    const tex = new THREE.CanvasTexture(ch.canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    let mat = toon({ map: tex });
    if (ch.glow) { const gt = new THREE.CanvasTexture(ch.glow); gt.colorSpace = THREE.SRGBColorSpace; mat = toon({ map: tex, emissive: '#ffffff', emissiveMap: gt }); }
    const w = ch.canvas.width * px2tile, h = ch.canvas.height * px2tile;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(ch.x * px2tile + w / 2, 0, ch.y * px2tile + h / 2);
    m.receiveShadow = true;
    scene.add(m);
  }
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), seaMat);
  sea.rotation.x = -Math.PI / 2;
  sea.position.set(MAP_W / 2, -0.7, MAP_H / 2);

}

  halo.scale.setScalar(0.38 * s);
  g.add(core, shell, halo);
  const x = V.x + dx * 0.2, z = V.z + dz * 0.2, y = clamp(V.y, 0.7, 1.4);
  g.position.set(x, y, z);
  scene.add(g);
  const light = FB_LIGHTS.find((l) => !l.userData.busy);
  if (light) { light.userData.busy = true; light.color.set(c.color); light.intensity = 6; }
  fireballs.push({ g, halo, x, y, z, dx, dz, dist: 0, light, c, trailT: 0 });
  burst(x, y, z, c.color, 5);
}
function explode(fb) {
  const { x, y, z, c } = fb;
  burst(x, y, z, c.color, 14);
  burst(x, y, z, '#fff4c0', 6);
  const b = new THREE.Mesh(FB_GEO, new THREE.MeshBasicMaterial({ color: c.color, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false }));
  b.position.set(x, y, z);
  scene.add(b);
  blasts.push({ m: b, age: 0, r: 0.6 + c.aoe * 0.6 });
  if (c.aoe) for (const m of monsters) if (!m.dead && Math.hypot(m.x - x, m.z - z) < c.aoe) hitMonster(m, stats.atk * 0.5 + stats.mag * 0.8);
  scene.remove(fb.g);
  fb.g.traverse((o) => o.material && o.material.dispose());
  if (fb.light) { fb.light.userData.busy = false; fb.light.intensity = 0; }
}
function updateFireballs(dt, t) {
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const fb = fireballs[i], step = 15 * dt;
    fb.x += fb.dx * step; fb.z += fb.dz * step; fb.dist += step;
    fb.g.position.set(fb.x, fb.y, fb.z);
    fb.halo.scale.setScalar(0.38 * fb.c.size * (1 + Math.sin(t * 40) * 0.12));
    if (fb.light) fb.light.position.copy(fb.g.position);
    fb.trailT += dt;
    if (fb.trailT > 0.03) { fb.trailT = 0; burst(fb.x, fb.y, fb.z, fb.c.color, 1); }
    let hit = null;
    for (const m of monsters) {
      if (m.dead) continue;
      const my = m.cfg.fly ? 1.1 : 0.5;
      if (Math.hypot(m.x - fb.x, m.z - fb.z) < (m.cfg.big ? 1.3 : 0.75) && Math.abs(my - fb.y) < 1.2) { hit = m; break; }
    }
    const cx = Math.floor(fb.x), cz = Math.floor(fb.z);
    const wall = cx < 0 || cz < 0 || cx >= MAP_W || cz >= MAP_H || (blocked[cz][cx] && waterAt(fb.x * T, fb.z * T) < 0)
      || circles.some(([x, z, r]) => Math.hypot(fb.x - x, fb.z - z) < r);
    if (hit) hitMonster(hit, stats.atk * 0.6 + stats.mag * 1.4);
    if (hit || wall || fb.dist > fb.c.range) { explode(fb); fireballs.splice(i, 1); }
  }
  for (let i = blasts.length - 1; i >= 0; i--) {
    const b = blasts[i];
    b.age += dt / 0.28;
    b.m.scale.setScalar(b.r * (0.4 + b.age));
    b.m.material.opacity = 0.6 * (1 - b.age);
    if (b.age >= 1) { scene.remove(b.m); b.m.material.dispose(); blasts.splice(i, 1); }
  }
}

function burst(x, y, z, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, mesh = new THREE.Mesh(GEO.box, new THREE.MeshBasicMaterial({ color, transparent: true }));
    mesh.scale.setScalar(0.08);
    mesh.position.set(x, y, z);
    scene.add(mesh);
    sparks.push({ mesh, v: [Math.cos(a) * 2.5, 2 + Math.random() * 1.5, Math.sin(a) * 2.5], age: 0, life: 0.5 });
  }
}
function killMonster(m) {
  m.dead = true;
  m.dying = 0;
  m.el.remove();
  burst(m.x, 0.5, m.z, m.cfg.big ? '#c06aff' : '#eaff8a', 12);
  const [g0, g1] = m.cfg.gold;
  spawnDrop({ kind: 'gold', amount: g0 + Math.floor(Math.random() * (g1 - g0 + 1)) }, m.x, m.z);
  spawnDrop({ kind: 'item', id: m.cfg.drop, amount: 1 }, m.x, m.z);
  const before = 1 + Math.floor(field.xp / 100);
  field.xp += m.cfg.xp;
  field.kills += 1;
  saveField();
  floatText(m.x, 1.8, m.z, `+${m.cfg.xp} XP`, '#ffe066');
  if (1 + Math.floor(field.xp / 100) > before) floatText(P.x, 2, P.z, 'LEVEL UP!', '#7ae0ff');
  updateHud();
  setTimeout(() => { const i = monsters.indexOf(m); if (i >= 0) monsters.splice(i, 1); spawnMonster(m.entry); }, m.cfg.respawn || 12000 + Math.random() * 6000);
}
function hurtPlayer(m, dx, dz, dist) {
  const dmg = Math.max(1, Math.round(m.cfg.dmg * 50 / (50 + stats.def)));
  hp = Math.max(0, hp - dmg);
  inv = 0.9;
  pkb = { x: dx / dist * 9.4, z: dz / dist * 9.4, t: 0.16 };
  shake = 0.15;
  floatText(P.x, 1.5, P.z, `-${dmg}`, '#ff6b6b');
  hero.hurt();
  updateHud();
  if (hp <= 0) faint();
}
function faint() {
  fainted = true;
  floatText(P.x, 2, P.z, 'You fainted...', '#ffffff');
  const fade = document.getElementById('fade');
  fade.style.opacity = 1;
  setTimeout(() => {
    P.x = START.x + 0.5; P.z = START.y + 0.75;
    hp = stats.hp; inv = 1.5; fainted = false;
    updateHud();
    fade.style.opacity = 0;
  }, 750);
}

// Drops pop out of the monster, bounce, then hover until walked over.
const COIN_GEO = new THREE.CylinderGeometry(0.2, 0.2, 0.06, 18), GEM_GEO = new THREE.OctahedronGeometry(0.18, 0);
const COIN_MAT = toon({ color: '#ffcf3a', emissive: '#a86a00' });
function spawnDrop(d, x, z) {

function collect(d) {

// Round minimap that turns with the camera (view direction is always up).
const miniStatic = (() => {
  const c = canvasOf(MAP_W * MINI, MAP_H * MINI), x = c.getContext('2d');
  x.imageSmoothingQuality = 'high';
  const k = MINI / (S * T);
  groundChunks.forEach((ch) => x.drawImage(ch.canvas, ch.x * k, ch.y * k, ch.canvas.width * k, ch.canvas.height * k));
  const colors = { bush: '#2f8f33', boulder: '#a49ad6', crystal: '#7ac8ff', fence: '#e0a060', log: '#8a4a2c', stump_tall: '#8a4a2c', stump_short: '#8a4a2c', palm: '#3fcf4a',

const mctx = $('minimap').getContext('2d');
function drawMinimap(now) {
  const W = 240, Z = 1.35;
  mctx.clearRect(0, 0, W, W);
  mctx.save();
  mctx.beginPath(); mctx.arc(W / 2, W / 2, W / 2, 0, Math.PI * 2); mctx.clip();
  mctx.fillStyle = OUTDOOR ? '#2f6cc0' : '#1a1428'; mctx.fillRect(0, 0, W, W);
  mctx.translate(W / 2, W / 2);
  mctx.rotate(camYaw);
  mctx.scale(Z, Z);
  mctx.translate(-P.x * MINI, -P.z * MINI);
  mctx.drawImage(miniStatic, 0, 0);
  for (const m of monsters) {
    if (m.dead) continue;
    mctx.fillStyle = m.cfg.big ? '#c06aff' : '#ff9a2a';
    mctx.beginPath(); mctx.arc(m.x * MINI, m.z * MINI, m.cfg.big ? 3 : 2, 0, Math.PI * 2); mctx.fill();
  }
  mctx.translate(P.x * MINI, P.z * MINI);
  mctx.rotate(Math.atan2(Math.cos(P.heading), Math.sin(P.heading)));
  mctx.fillStyle = Math.floor(now / 350) % 2 ? '#c8ff2e' : '#ffffff';
  mctx.strokeStyle = '#1a0a20'; mctx.lineWidth = 1.2;
  mctx.beginPath(); mctx.moveTo(6, 0); mctx.lineTo(-4, -4.5); mctx.lineTo(-2, 0); mctx.lineTo(-4, 4.5); mctx.closePath(); mctx.fill(); mctx.stroke();
  mctx.restore();
}

/* ---------- input: keyboard, drag to look, touch joystick on the left half ---------- */
const keys = {};
addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (modal) { if (e.code === 'Escape' || e.code === 'KeyF') closeModal(); return; } // a shop / crafting panel is open
  if (e.code === 'Space') jump();
  if (e.code === 'KeyJ' || e.code === 'KeyK') swing();
  if (e.code === 'KeyH') drinkBest();
  if (e.code === 'KeyB') toggleBag();
  if (e.code === 'KeyC') cycleCam();
  if (e.code === 'KeyF' && action) action.run();
  if (e.code === 'Escape') toggleBag(false);
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
let drag = null, joy = null;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  if (e.pointerType === 'touch' && e.clientX < innerWidth / 2 && !joy) { joy = { id: e.pointerId, sx: e.clientX, sy: e.clientY, fx: 0, fy: 0 }; return; }
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
  canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', (e) => {
  if (joy && e.pointerId === joy.id) {
    const dx = e.clientX - joy.sx, dy = e.clientY - joy.sy, d = Math.max(30, Math.hypot(dx, dy));
    joy.fx = dx / d; joy.fy = -dy / d;
  } else if (drag && e.pointerId === drag.id) {
    camYaw -= (e.clientX - drag.x) * 0.006;
    camPitchT = Math.max(0.05, Math.min(1.35, camPitchT + (e.clientY - drag.y) * 0.004));
    drag.x = e.clientX; drag.y = e.clientY;
    lastDrag = performance.now();
  }
});
const endPointer = (e) => {
  if (joy && e.pointerId === joy.id) joy = null;
  if (drag && e.pointerId === drag.id) { drag = null; canvas.classList.remove('drag'); }
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); camDistT = Math.max(3, Math.min(18, camDistT + e.deltaY * 0.006)); }, { passive: false });
$('attackBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); swing(); });
$('jumpBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
$('sailBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); if (action) action.run(); });
$('shopClose').addEventListener('click', closeModal);
$('shopTabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b && modal) { modal.tab = b.dataset.tab; renderModal(); } });
$('shopList').addEventListener('click', (e) => { const b = e.target.closest('button[data-act]'); if (b) shopAct(b.dataset.act, b.dataset.id, b.dataset.price || b.dataset.n); });
$('bagGrid').addEventListener('click', (e) => { const b = e.target.closest('[data-use]'); if (b) drink(b.dataset.use); });
$('camBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); cycleCam(); });
$('bagBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); toggleBag(); });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(), lookAt = new THREE.Vector3();
let first = true;

function update(dt, now) {
  const t = clock.elapsedTime;
  U.time.value = t;

  // movement relative to the camera
  const k = (c) => (keys[c] ? 1 : 0);
  let fy = fainted || modal ? 0 : k('KeyW') + k('ArrowUp') - k('KeyS') - k('ArrowDown');
  let fx = fainted || modal ? 0 : k('KeyD') + k('ArrowRight') - k('KeyA') - k('ArrowLeft');
  if (joy && !fainted) { fx += joy.fx; fy += joy.fy; }
  camYaw += (k('KeyQ') - k('KeyE')) * 2.2 * dt;
  const moving = Math.hypot(fx, fy) > 0.15;
  const boosting = moving && (keys.ShiftLeft || keys.ShiftRight) && !nitroLock && nitro > 0;
  if (boosting) { nitro -= dt * 0.12; if (nitro <= 0) { nitro = 0; nitroLock = true; } }
  else { nitro = Math.min(1, nitro + dt * 0.3); if (nitroLock && nitro > 0.25) nitroLock = false; }
  if (moving) {
    const sy = Math.sin(camYaw), cy = Math.cos(camYaw);
    let mx = -sy * fy + cy * fx, mz = -cy * fy - sy * fx;
    const len = Math.hypot(mx, mz), speed = (boosting ? 7.4 : 4.2) * Math.min(1, len);
    mx /= len; mz /= len;
    if (free(P.x + mx * speed * dt, P.z)) P.x += mx * speed * dt;
    if (free(P.x, P.z + mz * speed * dt)) P.z += mz * speed * dt;
    P.heading += wrapAngle(Math.atan2(mx, mz) - P.heading) * Math.min(1, dt * 14);
    P.phase += dt * speed * 2.4;
    // the camera drifts back behind the player unless they are steering it
    if (CAM_MODES[camMode].follow && fy >= 0 && now - lastDrag > 800) camYaw += wrapAngle(P.heading + Math.PI - camYaw) * Math.min(1, dt * 1.1);
  }
  if (pkb.t > 0) {
    pkb.t -= dt;
    if (free(P.x + pkb.x * dt, P.z)) P.x += pkb.x * dt;
    if (free(P.x, P.z + pkb.z * dt)) P.z += pkb.z * dt;
  }
  P.vy -= 22 * dt;
  P.y += P.vy * dt;
  if (P.y <= 0) { P.y = 0; P.vy = 0; P.grounded = 0; } else P.grounded += dt;
  U.player.value.set(P.x, P.y, P.z);

  // 3D hero: it reads its own speed from how the root moves; looks at the nearest monster or townsfolk
  if (P.atk >= 0) { P.atk += dt / 0.38; if (P.atk >= 1) P.atk = -1; }
  let look = null, ld = 6;
  for (const mo of monsters) { const d = Math.hypot(mo.x - P.x, mo.z - P.z); if (!mo.dead && d < ld) { ld = d; look = mo; } }
  for (const n of npcs) { const d = Math.hypot(n.x - P.x, n.z - P.z); if (d < Math.min(ld, 4)) { ld = d; look = n; } }
  hero.root.position.set(P.x, P.y, P.z);
  hero.root.rotation.y = P.heading;
  hero.update(dt, { atk: P.atk, lookAt: look, air: P.y > 0.001, vy: P.vy });
  hero.root.visible = !(inv > 0 && Math.floor(inv / 0.08) % 2);
  attackCd -= dt;
  inv -= dt;

  // monsters
  for (const mo of monsters) {
    const v = mo.view;
    if (mo.dead) {
      if (mo.dying !== undefined && mo.dying < 1) {
        mo.dying += dt / 0.22;
        v.g.scale.y = (mo.cfg.big ? 2.1 : 1) * Math.max(0.01, 1 - mo.dying);
        if (mo.dying >= 1) { scene.remove(v.g); mo.dying = 2; }
      }
      continue;
    }
    const dx = P.x - mo.x, dz = P.z - mo.z, dist = Math.hypot(dx, dz) || 1;
    let vx, vz;
    if (mo.kb > 0) { mo.kb -= dt; vx = mo.kbx; vz = mo.kbz; }
    else if (!fainted && dist < mo.cfg.aggro) { vx = dx / dist * mo.cfg.speed; vz = dz / dist * mo.cfg.speed; }
    else {
      mo.t -= dt;
      if (mo.t <= 0) {
        const a = Math.random() * Math.PI * 2, idle = Math.random() < 0.4;
        mo.vx = idle ? 0 : Math.cos(a) * mo.cfg.speed * 0.5;
        mo.vz = idle ? 0 : Math.sin(a) * mo.cfg.speed * 0.5;
        mo.t = 0.7 + Math.random() * 1.6;
      }
      vx = mo.vx; vz = mo.vz;
    }
    if (monsterFree(mo, mo.x + vx * dt, mo.z)) mo.x += vx * dt; else mo.t = 0;
    if (monsterFree(mo, mo.x, mo.z + vz * dt)) mo.z += vz * dt; else mo.t = 0;
    if (Math.hypot(vx, vz) > 0.05 && mo.kb <= 0) mo.face += wrapAngle(Math.atan2(vx, vz) - mo.face) * Math.min(1, dt * 8);
    const tt = t * 1 + mo.seed;
    v.g.position.set(mo.x, 0, mo.z);
    v.g.rotation.y = mo.face;
    if (mo.type === 'slime' || mo.type === 'king') { const s = Math.sin(tt * 6); v.body.scale.set(1 - s * 0.08, 1 + s * 0.12, 1 - s * 0.08); }
    else if (mo.type === 'shroom') v.body.rotation.z = Math.sin(tt * 5) * 0.12;
    else if (mo.type === 'bat') { v.body.position.y = 1.1 + Math.sin(tt * 3) * 0.15; v.wings.forEach((w, i) => { w.rotation.z = (i ? -1 : 1) * Math.sin(tt * 18) * 0.7; }); }
    else { v.body.position.y = Math.abs(Math.sin(tt * 7)) * 0.05; v.club.rotation.x = Math.sin(tt * 4) * 0.3; }
    if (mo.flash > 0) { mo.flash -= dt; v.mats.forEach((mt) => mt.emissive.set('#ffffff')); }
    else v.mats.forEach((mt, i) => mt.emissive.copy(v.base[i]));
    if (!fainted && inv <= 0 && P.y < (mo.cfg.fly ? 1.6 : 0.45) && dist < (mo.cfg.big ? 1.0 : 0.7)) hurtPlayer(mo, dx, dz, dist);

    // name tag (only nearby)
    const pos = dist < 13 ? toScreen(mo.x, (mo.cfg.big ? 2.4 : mo.cfg.fly ? 1.7 : mo.type === 'goblin' ? 1.55 : 1.05), mo.z) : null;
    mo.el.hidden = !pos;
    if (pos) {
      mo.el.style.transform = `translate(${pos[0]}px, ${pos[1]}px) translate(-50%, -100%)`;
      mo.bar.parentNode.hidden = mo.hp >= mo.cfg.hp;
      mo.bar.style.width = `${Math.max(0, mo.hp / mo.cfg.hp) * 100}%`;
    }
  }

  // drops
  for (const d of drops) {
    if (d.taken) {
      d.taken += dt / 0.22;
      d.mesh.position.lerp(V.set(P.x, 0.8, P.z), Math.min(1, dt * 14));
      d.mesh.scale.setScalar(Math.max(0.01, 1 - d.taken));
      if (d.taken >= 1) { scene.remove(d.mesh); d.gone = true; }
      continue;
    }
    if (!d.ready) {
      d.vy -= 14 * dt; d.y += d.vy * dt; d.x += d.vx * dt; d.z += d.vz * dt;
      if (d.y <= 0.35) { d.y = 0.35; d.vy *= -0.45; d.vx *= 0.5; d.vz *= 0.5; if (Math.abs(d.vy) < 0.8) d.ready = true; }
    }
    d.mesh.position.set(d.x, d.ready ? 0.4 + Math.sin(t * 3 + d.born) * 0.08 : d.y, d.z);
    d.mesh.rotation[d.kind === 'gold' ? 'z' : 'y'] = t * 3;
    if (now - d.born > 60000) { scene.remove(d.mesh); d.gone = true; }
    else if (d.ready && !fainted && Math.hypot(P.x - d.x, P.z - d.z) < 0.85) collect(d);
  }
  for (let i = drops.length - 1; i >= 0; i--) if (drops[i].gone) drops.splice(i, 1);

  // effects
  updateFireballs(dt, t);
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.age += dt;
    s.v[1] -= 9 * dt;
    s.mesh.position.x += s.v[0] * dt; s.mesh.position.y += s.v[1] * dt; s.mesh.position.z += s.v[2] * dt;
    s.mesh.material.opacity = Math.max(0, 1 - s.age / s.life);
    if (s.age >= s.life) { scene.remove(s.mesh); s.mesh.material.dispose(); sparks.splice(i, 1); }
  }

  // camera: chase from behind and above, looking a little ahead
  fov += ((boosting ? 70 : 58) - fov) * Math.min(1, dt * 6);
  camera.fov = fov;
  camera.updateProjectionMatrix();
  camDist = damp(camDist, camDistT, 5, dt);
  camPitch = damp(camPitch, camPitchT, 5, dt);
  clouds.rotation.y += dt * 0.006;
  if (UNDER) lantern.position.set(P.x, 1.8 + P.y, P.z);
  flicker.forEach((l, i) => { l.intensity = (l.userData.base || 8) + Math.sin(t * 13 + i * 2) * 0.8 + Math.sin(t * 7.1 + i) * 0.9; });
  for (const b of boats) {
    if (b.sail) {
      const a = t * b.sail.speed + b.ph;
      b.g.position.x = b.x + Math.sin(a) * b.sail.amp;
      b.g.rotation.y = damp(b.g.rotation.y, Math.cos(a) > 0 ? Math.PI / 2 : -Math.PI / 2, 1.2, dt);
    }
    b.g.position.y = b.y + Math.sin(t * 1.3 + b.ph) * 0.05;
    b.g.rotation.z = Math.sin(t * 0.9 + b.ph) * 0.04;
    b.g.rotation.x = Math.sin(t * 0.7 + b.ph * 2) * 0.02;
  }
  for (const f of fishJumps) {
    f.t += dt;
    if (f.t < 0) continue;
    if (!f.from) {
      const c = waterSpot();
      if (!c) { f.t = -3; continue; }
      const a = Math.random() * Math.PI * 2;
      f.from = c; f.dir = a; f.g.visible = true;
      splash(c[0], c[1]);
    }
    const k = f.t / 0.9, x = f.from[0] + Math.sin(f.dir) * 1.3 * k, z = f.from[1] + Math.cos(f.dir) * 1.3 * k;
    f.g.position.set(x, Math.sin(Math.PI * k) * 0.95 - 0.05, z);
    f.g.rotation.set(-Math.cos(Math.PI * k) * 1.1, f.dir, 0);
    if (k >= 1) { splash(x, z); f.g.visible = false; f.from = null; f.t = -1.5 - Math.random() * 3; }
  }
  for (const sc of schools) sc.fish.forEach((m, i) => {
    const a = t * sc.speed + (i / sc.fish.length) * Math.PI * 2 * 0.35, r = sc.r + Math.sin(t * 0.8 + i) * 0.25;
    m.position.set(sc.cx + Math.cos(a) * r, 0.02, sc.cz + Math.sin(a) * r);
    m.rotation.y = -a + (sc.speed > 0 ? 0 : Math.PI) + Math.sin(t * 6 + i) * 0.15;
  });
  for (let i = splashes.length - 1; i >= 0; i--) {
    const sp = splashes[i];
    sp.age += dt / 0.6;
    sp.m.scale.setScalar(0.15 + sp.age * 0.7);
    sp.m.material.opacity = 1 - sp.age;
    if (sp.age >= 1) { scene.remove(sp.m); sp.m.material.dispose(); splashes.splice(i, 1); }
  }
  const cp = Math.cos(camPitch), target = V.set(P.x, 0.9 + P.y * 0.5, P.z);
  const want = new THREE.Vector3(P.x + Math.sin(camYaw) * camDist * cp, target.y + Math.sin(camPitch) * camDist + 0.6, P.z + Math.cos(camYaw) * camDist * cp);
  if (first) { camPos.copy(want); first = false; } else camPos.lerp(want, Math.min(1, dt * 8));
  camera.position.copy(camPos);
  if (shake > 0) { shake -= dt; camera.position.x += (Math.random() - 0.5) * 0.15; camera.position.y += (Math.random() - 0.5) * 0.15; }
  const ahead = 2.2 * Math.max(0, Math.cos(camPitch * 1.15)); // look a little ahead, less so from high up
  lookAt.set(target.x - Math.sin(camYaw) * ahead, target.y, target.z - Math.cos(camYaw) * ahead);
  camera.lookAt(lookAt);
  for (const g of gates) if (g.arch) {
    const c = camera.position;
    g.arch.visible = !(g.edge === 'n' ? c.z < g.z + 0.6 : g.edge === 's' ? c.z > g.z - 0.6 : g.edge === 'w' ? c.x < g.x + 0.6 : c.x > g.x - 0.6);
  }
  updateSky();
  if (OUTDOOR) sun.position.set(P.x + sky.dir.x * 36, Math.max(sky.dir.y, 0.3) * 36, P.z + sky.dir.z * 36);
  else sun.position.set(P.x - 16, 30, P.z + 12);
  sun.target.position.set(P.x, 0, P.z);

  // labels, floating text, gates
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.age += dt / 0.8;
    const pos = toScreen(f.x, f.y + f.age * 0.8, f.z);
    f.el.style.opacity = Math.max(0, 1 - f.age * f.age);
    if (pos) f.el.style.transform = `translate(${pos[0]}px, ${pos[1]}px) translate(-50%, -50%) scale(${1 + Math.max(0, 0.3 - f.age)})`;
    if (f.age >= 1) { f.el.remove(); floats.splice(i, 1); }
  }
  // townsfolk turn to face you when you come near, and talk when you are close
  for (const n of npcs) {
    const d = Math.hypot(P.x - n.x, P.z - n.z);
    n.heading += wrapAngle((d < 4 ? Math.atan2(P.x - n.x, P.z - n.z) : 0) - n.heading) * Math.min(1, dt * 4);
    n.hero.root.position.set(n.x, 0, n.z);
    n.hero.root.rotation.y = n.heading;
    n.hero.update(dt, { lookAt: d < 6 ? P : null });
    if (d < 2.4 && !n.greeted) { n.greeted = true; n.hero.emote('happy', 1.2); }
    if (d > 4) n.greeted = false;
    const pos = d < 16 ? toScreen(n.x, HERO_H + 0.3, n.z) : null;
    n.el.hidden = !pos;
    if (pos) n.el.style.transform = `translate(${pos[0]}px, ${pos[1]}px) translate(-50%, -100%)`;
    const say = d < 2.4 ? `“${n.line}”` : n.sub;
    if (n.small.textContent !== say) n.small.textContent = say;
  }
  for (const s of signs) {
    const pos = Math.hypot(s.x - P.x, s.z - P.z) < 26 ? toScreen(s.x, s.y, s.z) : null;
    s.el.hidden = !pos;
    if (pos) s.el.style.transform = `translate(${pos[0]}px, ${pos[1]}px) translate(-50%, -100%)`;
  }
  let nearest = null, nd = 9;
  gates.forEach((g) => {
    const d = Math.hypot(g.x - P.x, g.z - P.z), pos = d < 22 ? toScreen(g.x, g.y, g.z) : null;
    g.el.hidden = !pos;
    if (pos) g.el.style.transform = `translate(${pos[0]}px, ${pos[1]}px) translate(-50%, -100%)`;
    if (d < nd) { nd = d; nearest = g; }
  });
  action = modal || fainted ? null : currentAction();
  $('sailBtn').hidden = !action;
  if (action && $('sailBtn').dataset.label !== action.btn) { $('sailBtn').dataset.label = action.btn; $('sailBtn').innerHTML = `${action.btn}<kbd>F</kbd>`; }
  $('nearChip').hidden = !nearest && !action;
  if (action) $('nearText').textContent = action.text;
  else if (nearest) $('nearText').textContent = nearest.name;

  // HUD bits that change every frame
  $('nitroFill').style.width = `${nitro * 100}%`;
  $('nitroFill').style.opacity = nitroLock ? 0.4 : 1;
  $('nitroText').textContent = nitro >= 1 ? 'Ready' : `${Math.round(nitro * 100)}%`;
  drawMinimap(now);

  // stitched maps: the area name follows you as you walk from one district into the next
  const region = (A.regions || []).find(({ box: [x1, z1, x2, z2] }) => P.x >= x1 && P.z >= z1 && P.x < x2 && P.z < z2);
  if (region && $('areaTitle').textContent !== region.title) {
    $('areaTitle').textContent = region.title;
    $('miniLabel').textContent = region.title.replace('Taproot ', 'The ');
  }

  // walk off the map through an opening (or into a door) -> the neighbouring area
  const gx = Math.floor(P.x), gz = Math.floor(P.z);
  const exit = A.exits.find(({ edge, range: [a, b] }) =>
    edge === 'n' ? P.z <= 0.6 && gx >= a && gx <= b : edge === 's' ? P.z >= MAP_H - 0.3 && gx >= a && gx <= b
      : (edge === 'w' ? P.x <= 0.45 : P.x >= MAP_W - 0.45) && gz >= a && gz <= b)
    || (A.doors || []).find((d) => gx >= d.x && gx < d.x + d.w && gz >= d.y && gz < d.y + d.h);
  if (!leaving && exit) { leaving = true; $('fade').style.opacity = 1; setTimeout(() => { location.href = exit.href; }, 350); }
}

SPAWN_LIST.forEach((type) => spawnMonster(type));
// debug hook for tests and screenshots: __world3d.tp(x, z) teleports, .P is the player state
window.__world3d = { P, tp: (x, z, yaw) => { P.x = x; P.z = z; if (yaw !== undefined) camYaw = yaw; }, size: [MAP_W, MAP_H] };
updateHud();
renderBag();
(function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt, performance.now());
  composer.render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
